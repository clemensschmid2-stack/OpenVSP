name: VSPAERO native validation
on:
  pull_request:
    paths:
      - 'src/vsp_aero/**'
      - 'parity_tests/**'
      - 'reference_builds/**'
      - '.github/workflows/native-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.1.1 numpy==2.5.3 matplotlib==3.11.1
      - run: python parity_tests/run_native_checks.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: build/ci/vspaero/
          if-no-files-found: error
